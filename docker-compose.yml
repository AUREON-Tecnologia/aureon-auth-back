services:
  auth-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: aureon-auth-service
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3001
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Infraestructura compartida entre microservicios AUREON (blacklist de tokens,
  # ver @aureon/redis-client). En un entorno local con varios servicios AUREON
  # corriendo a la vez, levantar este contenedor una sola vez (aqui o en otro
  # repo) y apuntar el resto via REDIS_HOST/REDIS_PORT, no duplicarlo.
  redis:
    image: redis:7-alpine
    container_name: aureon-redis
    ports:
      - "6379:6379"
    restart: unless-stopped