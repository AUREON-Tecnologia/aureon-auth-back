trigger:
  branches:
    include:
      - main


variables:
- group: vercel-secrets-variables

steps:

- script: npm ci

- script: npm run build

- script: npm install -g vercel

- script: |
    vercel pull \
      --yes \
      --environment=production \
      --token=$(VERCEL_TOKEN)

    vercel build \
      --prod \
      --token=$(VERCEL_TOKEN)

    vercel deploy \
      --prebuilt \
      --prod \
      --token=$(VERCEL_TOKEN)
  env:
    VERCEL_ORG_ID: $(VERCEL_ORG_ID)
    VERCEL_PROJECT_ID: $(VERCEL_PROJECT_ID)