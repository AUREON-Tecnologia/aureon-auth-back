trigger:
  branches:
    include:
      - main

steps:

- task: NodeTool@0
  inputs:
    versionSpec: '20'

- script: npm ci

- script: npm run build

- script: npm install -g vercel

- script: |
    vercel pull \
      --yes \
      --environment=production \
      --token=$(vcp_0PMzJKwF02T8Ge9jKvGESWSUN2VNCl0krVDCCHISLE5cbgGNPN1OPNrT)

    vercel build \
      --prod \
      --token=$(vcp_0PMzJKwF02T8Ge9jKvGESWSUN2VNCl0krVDCCHISLE5cbgGNPN1OPNrT)

    vercel deploy \
      --prebuilt \
      --prod \
      --token=$(vcp_0PMzJKwF02T8Ge9jKvGESWSUN2VNCl0krVDCCHISLE5cbgGNPN1OPNrT)
  env:
    VERCEL_ORG_ID: $(team_zOmNKlmv4FZOUE7OdjFhsMdq)
    VERCEL_PROJECT_ID: $(prj_Je0LW5ISyKQCp3EU70T9kO7ykcLx)