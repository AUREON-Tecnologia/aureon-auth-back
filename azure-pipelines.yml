trigger:
  branches:
    include:
      - main

variables:
- group: vercel-secrets-variables

stages:

- stage: Build
  displayName: Build Code

  jobs:
  - job: Build
    pool:
      vmImage: ubuntu-latest

    steps:
    - script: npm ci
      displayName: Install dependencies

    - script: npm run build
      displayName: Build project

- stage: Deploy
  displayName: Deploy to Vercel

  dependsOn: Build

  jobs:
  - deployment: DeployVercel

    environment: Production

    strategy:
      runOnce:
        deploy:
          steps:

          - script: npm install -g vercel
            displayName: Install Vercel CLI

          - script: |
              vercel pull \
                --yes \
                --environment=production \
                --token=$(VERCEL_TOKEN)

              vercel build \
                --prod \
                --token=$(VERCEL_TOKEN)

              vercel deploy \
                --prebuilt \
                --prod \
                --token=$(VERCEL_TOKEN)
            displayName: Deploy to Vercel

            env:
              VERCEL_ORG_ID: $(VERCEL_ORG_ID)
              VERCEL_PROJECT_ID: $(VERCEL_PROJECT_ID)